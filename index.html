<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QTE 回合制戰鬥 - 星空彼方的約定</title>
    <style>
                /* 🌐 WebRTC 連線介面專屬樣式 */
        .webrtc-panel {
            width: 90%; 
            max-width: 500px; 
            text-align: left; 
            flex-shrink: 0; /* 【關鍵】防止在手機螢幕上被硬擠壓 */
            height: auto;   /* 讓內容自然撐開高度 */
            margin-bottom: 20px; 
            box-sizing: border-box;
        }
        .webrtc-textarea {
            width: 100%; 
            height: 60px; 
            margin-top: 10px; 
            margin-bottom: 5px;
            background: #222; 
            color: #2ecc71; /* 改成終端機感的綠字 */
            border: 1px solid #555; 
            border-radius: 5px; 
            padding: 10px; 
            box-sizing: border-box; /* 【關鍵】防止輸入框寬度超出外框 */
            resize: none; 
            font-size: 12px; 
            font-family: monospace;
            word-break: break-all;
        }
        
        /* 【重要優化】：全局禁用文字選取、長按選單、與瀏覽器預設手勢 */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #2b2b2b; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; 
            touch-action: none; /* 禁用雙擊放大與滑動回退，防止小遊戲卡頓 */
            overflow: hidden;
        }
        
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 85vh; width: 100%; }
        .screen.active { display: flex; }
        
        /* 專門給選項過多的選單使用的滾動樣式 */
        .scrollable-screen {
            justify-content: flex-start !important; 
            overflow-y: auto;
            touch-action: pan-y; 
            max-height: 95vh;
            padding-top: 30px;
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch; 
        }
        
        /* 美化滾動條 */
        .scrollable-screen::-webkit-scrollbar { width: 6px; }
        .scrollable-screen::-webkit-scrollbar-track { background: transparent; }
        .scrollable-screen::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .scrollable-screen::-webkit-scrollbar-thumb:hover { background: #aaa; }
        
        .menu-title { font-size: 36px; color: #ff9f43; margin-bottom: 20px; text-shadow: 0 0 15px #ff9f43; }
        .menu-subtitle { font-size: 24px; color: #fff; margin-bottom: 30px; margin-top: 10px;}
        .menu-btn { background-color: #3498db; color: #fff; font-size: 20px; padding: 15px 40px; border-radius: 10px; border: none; margin: 10px; cursor: pointer; transition: transform 0.2s, background-color 0.2s; font-weight: bold; width: 80%; max-width: 300px; flex-shrink: 0; }
        .menu-btn:active { transform: scale(0.95); }
        
        .btn-story { background-color: #e67e22; box-shadow: 0 0 10px #e67e22;}
        .btn-boss-mode { background-color: #8e44ad; }
        .btn-char-bredeia { background-color: #9b59b6; }
        .btn-char-nagito { background-color: #e74c3c; }
        .btn-char-tsukito { background-color: #e056fd; }
        .btn-boss-dummy { background-color: #c0392b; }
        .btn-boss-tutorial { background-color: #27ae60; } 

        /* AVG 劇情模式與選項樣式 */
        #screen-story { transition: background-color 0.5s ease; justify-content: flex-end; padding-bottom: 50px; background-color: #1a1a2e; }
        #story-dialogue-box { background: rgba(0, 0, 0, 0.85); border: 2px solid #aaa; border-radius: 10px; width: 90%; max-width: 500px; padding: 20px; text-align: left; position: relative; min-height: 120px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
        #story-speaker { color: #feca57; font-size: 18px; font-weight: bold; margin-bottom: 10px; min-height: 24px;}
        #story-text { font-size: 17px; line-height: 1.6; white-space: pre-line; text-shadow: 1px 1px 2px #000; }
        .story-hint { position: absolute; right: 15px; bottom: 10px; font-size: 12px; color: #aaa; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #story-choices { display: none; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;}
        .story-btn { background-color: #3498db; color: #fff; padding: 10px 20px; font-size: 16px; border: 2px solid #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .story-btn.disabled { background-color: #555; color: #888; border-color: #777; cursor: not-allowed; }
        .story-btn:not(.disabled):active { transform: scale(0.9); }

        /* 戰鬥與小遊戲共用樣式 */
        .battle-stage { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 600px;}
        .character-box { border: 2px solid #ccc; border-radius: 10px; padding: 10px; width: 130px; background-color: #3a3a3a; transition: all 0.5s ease; transform-origin: center; }
        .enemies-container { display: flex; flex-direction: column; gap: 10px; }
        .name-title { font-size: 16px; margin: 5px 0; }
        .hp-text { color: #ff6b6b; font-weight: bold; font-size: 16px; }
        .sp-text { color: #54a0ff; font-weight: bold; font-size: 16px; }
        .status-enemy { color: #feca57; font-weight: bold; font-size: 12px; min-height: 16px; }
        .status-player { color: #9b59b6; font-weight: bold; font-size: 14px; min-height: 20px; }
        
        .ui-panel { border: 2px solid #aaa; padding: 15px; width: 90%; max-width: 450px; margin: 0 auto; border-radius: 10px; background-color: #1e1e1e; min-height: 160px; position: relative;}
        #message-box { font-size: 15px; margin-bottom: 15px; color: #feca57; min-height: 40px; white-space: pre-line; }
        
        button { padding: 8px 12px; font-size: 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; margin: 4px; }
        
        #action-menu { display: flex; flex-wrap: wrap; justify-content: center; }
        #skill-menu, #item-menu, #target-menu, #qte-area, #mash-area { display: none; }
        
        .btn-attack { background-color: #48dbfb; color: #000; }
        .btn-skill-main { background-color: #9b59b6; color: #fff; } 
        .btn-item { background-color: #2ecc71; color: #000; }
        .btn-back { background-color: #7f8c8d; color: #fff; }
        
        .qte-bar { width: 100%; height: 25px; background-color: #555; border: 2px solid #fff; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; }
        .qte-target-main { position: absolute; height: 100%; display: none; transition: width 0.1s ease, left 0.1s ease; } 
        .qte-target-perfect { position: absolute; height: 100%; z-index: 2; display: none; } 
        .qte-target-aoe { position: absolute; height: 100%; width: 10%; background-color: #2ecc71; display: none; }
        .qte-cursor { position: absolute; left: 0%; width: 6px; height: 100%; background-color: #fff; box-shadow: 0 0 5px #fff; z-index: 3; transition: opacity 0.1s; }
        #qte-cursor-2, #qte-cursor-3 { display: none; } 
        
        .blind-mode .qte-target-main, .blind-mode .qte-target-perfect, .blind-mode .qte-target-aoe { opacity: 0 !important; }
        
        .mash-bar-container { width: 100%; height: 25px; background-color: #333; border: 2px solid #fff; border-radius: 15px; overflow: hidden; margin-bottom: 10px; position: relative; }
        #mash-fill { width: 0%; height: 100%; background-color: #9b59b6; box-shadow: 0 0 10px #9b59b6; transition: width 0.1s; }
        #mash-timer-text { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        #mash-btn { background-color: #9b59b6; color: #fff; padding: 15px 40px; font-size: 20px; border-radius: 50px; }
        #mash-btn:active { transform: scale(0.9); background-color: #8e44ad; }
        
        #action-btn, #hold-btn { background-color: #ff9f43; color: #fff; transform: scale(1.1); padding: 12px 30px; font-size: 18px; display: inline-block;}
        #action-btn:active { transform: scale(0.9); }
        #hold-btn:active { transform: scale(0.95); box-shadow: 0 0 15px #f39c12; }

        /* 新增：雙色 QTE 專用按鈕容器 */
        #dual-btn-container { display: none; justify-content: center; gap: 20px; }
        .dual-btn { color: #fff; padding: 12px 30px; font-size: 18px; border-radius: 10px; border: 2px solid #fff; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .dual-btn:active { transform: scale(0.9); }
        #dual-btn-red { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        #dual-btn-blue { background-color: #3498db; box-shadow: 0 0 10px #3498db; }

        /* 逃跑與雷射小遊戲共用/專屬樣式 */
        .minigame-screen { background-color: #1a1a1a; }
        .run-status-panel { background: rgba(0,0,0,0.8); border: 2px solid #e74c3c; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; margin-bottom: 30px; }
        .run-title { color: #e74c3c; font-size: 22px; margin-top: 0; text-shadow: 0 0 10px #e74c3c; animation: blink 1s infinite;}
        .run-info { font-size: 18px; margin: 10px 0; }
        .minigame-btn { background-color: #3498db; color: #fff; padding: 15px 40px; font-size: 20px; border-radius: 10px; font-weight: bold; margin-top: 10px; border: none; cursor: pointer; }
        .minigame-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1 class="menu-title">星空彼方的約定<br><span style="font-size:18px; color:#aaa;">QTE 戰鬥模擬器</span></h1>
        <button class="menu-btn btn-story" onpointerdown="showScreen('screen-story-select')">📖 劇情模式</button>
        <button class="menu-btn btn-boss-mode" onpointerdown="showScreen('screen-char')">⚔️ Boss 挑戰模式</button>
        <button class="menu-btn" style="background-color: #27ae60;" onpointerdown="showScreen('screen-webrtc')">🌐 雙人連線模式 (Beta)</button>
    </div>

       <div id="screen-webrtc" class="screen scrollable-screen">
        <h2 class="menu-subtitle" style="color: #2ecc71;">終端機連線系統 (P2P)</h2>
        
        <div class="ui-panel webrtc-panel">
            <h3 style="color: #f1c40f; margin-top: 0;">▶ 1P (房主) 建立連線</h3>
            <button class="minigame-btn" style="background-color: #e67e22; padding: 10px 20px;" onpointerdown="createHost()">1. 產生邀請碼</button>
            <textarea id="local-sdp" class="webrtc-textarea" placeholder="系統將在此產生邀請碼...請複製給 2P" readonly></textarea>
            <textarea id="remote-answer" class="webrtc-textarea" placeholder="請在此貼上 2P 回傳的【回應碼】"></textarea>
            <button class="minigame-btn" style="background-color: #27ae60; padding: 10px 20px;" onpointerdown="connectHost()">3. 確認連線</button>
        </div>

        <div class="ui-panel webrtc-panel">
            <h3 style="color: #3498db; margin-top: 0;">▶ 2P 加入連線</h3>
            <textarea id="remote-offer" class="webrtc-textarea" placeholder="請在此貼上 1P 傳來的【邀請碼】"></textarea>
            <button class="minigame-btn" style="background-color: #3498db; padding: 10px 20px;" onpointerdown="joinGame()">2. 接受邀請並產生回應碼</button>
            <textarea id="local-answer" class="webrtc-textarea" placeholder="系統將在此產生回應碼...請複製回傳給 1P" readonly></textarea>
        </div>

        <div id="connection-status" style="font-size: 18px; color: #aaa; font-weight: bold; margin-top: 10px;">狀態：等待連線中...</div>
        <button class="menu-btn btn-back" style="margin-top: 20px;" onpointerdown="showScreen('screen-menu')">返回標題</button>
    </div>

    <div id="screen-story-select" class="screen scrollable-screen">
        <h2 class="menu-subtitle">選擇章節</h2>
        
        <h3 style="color: #aaa; margin-bottom: 10px; font-size: 18px; flex-shrink: 0;">【序章：星空彼方的約定】</h3>
        <button class="menu-btn" style="background-color: #e67e22; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(1)">第一幕：祭典與星之門</button>
        <button class="menu-btn" style="background-color: #d35400; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(2)">第二幕：虛擬訓練</button>
        <button class="menu-btn" style="background-color: #a84300; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(3)">第三幕：冰雪與月兔</button>
        
        <h3 style="color: #aaa; margin-top: 20px; margin-bottom: 10px; font-size: 18px; flex-shrink: 0;">【第一章：永夜之城】</h3>
        <button class="menu-btn" style="background-color: #8e44ad; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(4)">第一幕：夢境與啟程</button>
        <button class="menu-btn" style="background-color: #9b59b6; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(5)">第二幕：廢墟遭遇戰</button>
        <button class="menu-btn" style="background-color: #2980b9; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(6)">第三幕：廢棄實驗室</button> 
        <button class="menu-btn" style="background-color: #1abc9c; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(7)">第四幕：沉寂之心</button>
        <button class="menu-btn" style="background-color: #16a085; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(8)">第五幕：密室陷阱</button>
        <button class="menu-btn" style="background-color: #f39c12; padding: 10px 20px; font-size: 16px;" onpointerdown="loadChapter(9)">第六幕：中央都市的交鋒</button>

        <button class="menu-btn btn-back" style="margin-top: 30px; margin-bottom: 40px;" onpointerdown="showScreen('screen-menu')">返回標題</button>
    </div>

    <div id="screen-story" class="screen">
        <div id="story-dialogue-box" onpointerdown="advanceStory(event)">
            <div id="story-speaker"></div>
            <div id="story-text"></div>
            <div id="story-choices"></div>
            <div class="story-hint" id="story-hint">點擊螢幕繼續...</div>
        </div>
    </div>

    <div id="screen-run" class="screen minigame-screen">
        <div class="run-status-panel">
            <h2 class="run-title">🚨 敵襲！清掃者追擊 🚨</h2>
            <div class="run-info">鈴仙凪人 HP: <span id="run-hp" style="color: #ff6b6b; font-weight: bold;">25</span></div>
            <div class="run-info">成功閃避: <span id="run-progress" style="color: #3498db; font-weight: bold;">0</span> / 10</div>
            <div id="run-msg" style="color: #feca57; margin-top: 15px; min-height: 25px;">帶著月兔逃跑！注意後方的攻擊！</div>
        </div>
        <div class="qte-bar" style="width: 90%; max-width: 450px;">
            <div class="qte-target-main" id="run-target-zone" style="background-color: #3498db;"></div>
            <div class="qte-cursor" id="run-cursor"></div>
        </div>
        <button class="minigame-btn" onpointerdown="checkRunQte()">躲避！</button>
    </div>

    <div id="screen-laser" class="screen minigame-screen">
        <div class="run-status-panel" style="border-color: #f39c12;">
            <h2 class="run-title" style="color: #f39c12; text-shadow: 0 0 10px #f39c12;">⚠️ 致命雷射通道 ⚠️</h2>
            <div class="run-info">鈴仙凪人 HP: <span id="laser-hp" style="color: #ff6b6b; font-weight: bold;">25</span></div>
            <div class="run-info">突破進度: <span id="laser-progress" style="color: #2ecc71; font-weight: bold;">0</span> / 5</div>
            <div id="laser-msg" style="color: #feca57; margin-top: 15px; min-height: 25px;">觀察雷射的間隙... 準備前進！</div>
        </div>
        <div class="qte-bar" style="width: 90%; max-width: 450px; background-color: #e74c3c;"> 
            <div class="qte-target-main" id="laser-target-zone" style="background-color: #2ecc71;"></div> 
            <div class="qte-cursor" id="laser-cursor"></div>
        </div>
        <button class="minigame-btn" style="background-color: #f39c12;" onpointerdown="checkLaserQte()">穿越！</button>
    </div>

    <div id="screen-char" class="screen">
        <h2 class="menu-subtitle">選擇出戰角色</h2>
        <button class="menu-btn btn-char-bredeia" onpointerdown="selectCharacter('bredeia')">布蕾蒂雅 (破甲/群星)</button>
        <button class="menu-btn btn-char-nagito" onpointerdown="selectCharacter('nagito')">鈴仙凪人 (三連斬/一閃/反擊)</button>
        <button class="menu-btn btn-char-tsukito" onpointerdown="selectCharacter('tsukito')">鈴仙月兔 (連踢/蓄力)</button>
        <button class="menu-btn btn-back" style="margin-top: 30px;" onpointerdown="showScreen('screen-menu')">返回標題</button>
    </div>

    <div id="screen-boss" class="screen scrollable-screen">
        <h2 class="menu-subtitle">選擇討伐目標</h2>
        <button class="menu-btn btn-boss-tutorial" onpointerdown="selectBoss('tutorial')">🔰 新手教學：基礎訓練</button>
        <button class="menu-btn btn-boss-dummy" onpointerdown="selectBoss('dummy')">⚠️ 實戰：訓練人偶 PRO</button>
        <button class="menu-btn btn-boss-mode" style="background-color: #c0392b;" onpointerdown="selectBoss('cleaner')">🤖 廢墟清掃者 (創新變速AI)</button>
        <button class="menu-btn btn-boss-mode" style="background-color: #8e44ad;" onpointerdown="selectBoss('elite_cleaners')">⚔️ 雙子精英清掃者 (赫爾墨斯派遣)</button>
        <button class="menu-btn btn-back" style="margin-top: 30px; margin-bottom: 40px;" onpointerdown="showScreen('screen-char')">重新選擇角色</button>
    </div>

    <div id="screen-battle" class="screen">
        <div class="battle-stage">
            <div class="character-box">
                <h2 class="name-title" id="player-name">角色名稱</h2>
                <div class="status-player" id="player-status"></div>
                <p style="margin: 5px 0;">HP: <span class="hp-text" id="player-hp">20</span> / <span id="player-max-hp">20</span></p>
                <p style="margin: 5px 0;">SP: <span class="sp-text" id="player-sp">20</span> / <span id="player-max-sp">20</span></p>
            </div>
            <div class="enemies-container" id="enemies-area"></div>
        </div>

        <div class="ui-panel">
            <div id="message-box">戰鬥即將開始...</div>
            <div id="action-menu">
                <button class="btn-attack" onpointerdown="playSound('click'); startAction('attack')">攻擊</button>
                <button class="btn-skill-main" onpointerdown="playSound('click'); openSkillMenu()">技能</button>
                <button class="btn-item" onpointerdown="playSound('click'); openItemMenu()">道具</button>
            </div>
            <div id="skill-menu"></div>
            <div id="target-menu"><div id="target-buttons"></div></div>
            <div id="item-menu">
                <button class="btn-item" onpointerdown="playSound('heal'); useItem('potion')">回復藥 (<span id="potion-count">5</span>)</button>
                <button class="btn-item" onpointerdown="playSound('heal'); useItem('ether')">魔法水 (<span id="ether-count">5</span>)</button>
                <button class="btn-item" onpointerdown="playSound('heal'); useItem('antidote')">解毒草 (<span id="antidote-count">3</span>)</button>
                <button class="btn-back" onpointerdown="playSound('cancel'); closeSubMenus()">返回</button>
            </div>

            <div id="qte-area">
                <div class="qte-bar" id="qte-bar-main">
                    <div class="qte-target-main" id="qte-main-zone"></div>
                    <div class="qte-target-perfect" id="qte-perfect-zone"></div>
                    <div class="qte-target-aoe" id="aoe-zone-1"></div>
                    <div class="qte-target-aoe" id="aoe-zone-2"></div>
                    <div class="qte-target-aoe" id="aoe-zone-3"></div>
                    <div class="qte-cursor" id="qte-cursor"></div>
                    <div class="qte-cursor" id="qte-cursor-2"></div>
                    <div class="qte-cursor" id="qte-cursor-3"></div>
                </div>
                <button id="action-btn" onpointerdown="checkQte()">動作！</button>
                <button id="hold-btn" onpointerdown="startHoldQte(event)" onpointerup="endHoldQte(event)" onpointerleave="endHoldQte(event)" style="display:none;">按住蓄力！</button>
                
                <div id="dual-btn-container">
                    <button class="dual-btn" id="dual-btn-red" onpointerdown="checkDualQte('red')">紅！</button>
                    <button class="dual-btn" id="dual-btn-blue" onpointerdown="checkDualQte('blue')">藍！</button>
                </div>
            </div>

            <div id="mash-area">
                <div class="mash-bar-container"><div id="mash-fill"></div></div>
                <div id="mash-timer-text">2.0 秒</div>
                <button id="mash-btn" onpointerdown="doMash()">瘋狂連打！</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        const bgm = new Audio('bgm.mp3'); 
        bgm.loop = true; 
        bgm.volume = 0.5;

        function changeBGM(bossType) {
            let trackName = (bossType === 'cleaner' || bossType === 'elite_cleaners') ? 'bgm2.mp3' : 'bgm.mp3';
            if (!bgm.src.endsWith(trackName)) {
                bgm.src = trackName;
                bgm.load();
            }
            bgm.currentTime = 0;

            function runLoop(currentTime) {

                    ui.msgBox.innerText = `訓練人偶PRO 揮出【高壓電擊棍】！\n(附帶麻痺干擾效果...)`; setTimeout(() => { configureQteZones('defend'); setupQteUI("click", "防禦 / 閃避！", "#3498db", `電擊襲來！`); startQteAnimation(); }, 1500); 
                }
            } 
            else if (enemy.name === "無人機僕從") {
                let moves = ["multihit", "fast"]; if (!player.blinded) moves.push("blind"); if (moves.includes(enemy.lastMove) && moves.length > 1) { moves = moves.filter(m => m !== enemy.lastMove); } let chosen = moves[Math.floor(Math.random() * moves.length)]; enemy.lastMove = chosen;
                if (chosen === "blind") { player.blinded = true; updatePlayerStatus(); ui.msgBox.innerText = `無人機僕從 投擲了【致盲閃光彈】！\n${player.name} 的視線被干擾了！`; activeEnemyIndex++; setTimeout(processEnemyTurnQueue, 2000); }
                else if (chosen === "multihit") { 
                    qteType = 'multihit'; multiHitMax = 3; qteSpeed = 1.5; currentEnemyAttack = { name: "連續打擊測試", dmg: 2, appliesPoison: false }; 
                    ui.msgBox.innerText = `無人機僕從 發動【連續打擊測試】！\n(連續防禦 3 次！)`; 
                    setTimeout(() => { configureQteZones('defend'); setupQteUI("click", "連續防禦！", "#3498db", `攻擊！(第 1 擊)`); startQteAnimation(); }, 1500); 
                }
                else if (chosen === "fast") { qteSpeed = 2.5; currentEnemyAttack = { name: "急速俯衝", dmg: 3, appliesPoison: false }; ui.msgBox.innerText = `無人機僕從 啟動噴射引擎！\n(極高速衝撞！)`; setTimeout(() => { configureQteZones('defend'); setupQteUI("click", "防禦 / 閃避！", "#3498db", `快速攻擊襲來！`); startQteAnimation(); }, 1500); }
            }
        }

        // ==========================================
        // 🌐 WebRTC 手動連線系統
        // ==========================================
        let peerConnection;
        let dataChannel;
        let isMultiplayer = false; 
        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function setupDataChannel(channel) {
            channel.onopen = () => {
                isMultiplayer = true;
                document.getElementById('connection-status').innerText = "狀態：連線成功！神經連結已建立！";
                document.getElementById('connection-status').style.color = "#f1c40f";
                playSound('skill');
                // 測試：雙方互相打招呼
                sendGameData({ type: 'sync', msg: '已成功連接到星空彼方！' });
            };
            channel.onclose = () => { isMultiplayer = false; document.getElementById('connection-status').innerText = "狀態：連線已斷開。"; document.getElementById('connection-status').style.color = "#e74c3c"; };
            channel.onmessage = (event) => { handleIncomingData(JSON.parse(event.data)); };
        }

        async function createHost() {
            playSound('click');
            peerConnection = new RTCPeerConnection(iceServers);
            dataChannel = peerConnection.createDataChannel('qteBattleChannel');
            setupDataChannel(dataChannel);

            peerConnection.onicecandidate = (event) => {
                if (!event.candidate) {
                    document.getElementById('local-sdp').value = JSON.stringify(peerConnection.localDescription);
                    document.getElementById('connection-status').innerText = "狀態：已產生邀請碼，請複製給 2P。";
                }
            };
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
        }

        async function joinGame() {
            playSound('click');
            const offerStr = document.getElementById('remote-offer').value;
            if (!offerStr) return alert("請先貼上 1P 的邀請碼！");

            peerConnection = new RTCPeerConnection(iceServers);
            peerConnection.ondatachannel = (event) => { dataChannel = event.channel; setupDataChannel(dataChannel); };

            peerConnection.onicecandidate = (event) => {
                if (!event.candidate) {
                    document.getElementById('local-answer').value = JSON.stringify(peerConnection.localDescription);
                    document.getElementById('connection-status').innerText = "狀態：已產生回應碼，請回傳給 1P。";
                }
            };
            await peerConnection.setRemoteDescription(JSON.parse(offerStr));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
        }

        async function connectHost() {
            playSound('click');
            const answerStr = document.getElementById('remote-answer').value;
            if (!answerStr) return alert("請先貼上 2P 的回應碼！");
            await peerConnection.setRemoteDescription(JSON.parse(answerStr));
        }

        function sendGameData(dataObj) {
            if (isMultiplayer && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(dataObj));
            }
        }

        function handleIncomingData(data) {
            console.log("收到對手資料:", data);
            if (data.type === 'action') {
                ui.msgBox.innerText += `\n[連線] 對手使用了 ${data.skill}，造成 ${data.damage} 點傷害！`;
                playSound('hit');
            } else if (data.type === 'sync') {
                ui.msgBox.innerText = data.msg;
            }
        }
    </script>
